name: NEAR contract — tests and WASM
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Execute Rust tests
        run: cargo test --all-targets
      - name: Build NEAR WASM
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Verify compiled contract
        run: |
          test -s target/wasm32-unknown-unknown/release/agentguard_near.wasm
          sha256sum target/wasm32-unknown-unknown/release/agentguard_near.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: agentguard-near-testnet-wasm
          path: target/wasm32-unknown-unknown/release/agentguard_near.wasm
