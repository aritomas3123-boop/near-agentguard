[package]
name = "agentguard-near"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NEAR testnet AgentGuard policy proof of concept; no transfers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
borsh = "1.5"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
